<!doctype html><html><head><meta charset="utf-8"><style>
/* Vídeos universais da Black Botanika (1º lote, 04/11). Preto e vermelho.
   Regras: sem data, sem %, sem nome de campanha; texto fora dos 14% de cima (268px) e dos 35% de baixo (1248px). */
@font-face{font-family:IS;src:url(InstrumentSans-SemiBold.woff2)}
@font-face{font-family:IDB;src:url(InterDisplay-Black.otf)}
@font-face{font-family:IDX;src:url(InterDisplay-ExtraBold.otf)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.L{position:absolute;inset:0;display:none}
/* gancho */
#hook{top:290px;bottom:auto;height:auto;flex-direction:column;align-items:center}
.hl{font:88px/1.02 IDB;color:#fff;letter-spacing:-1.5px;text-align:center;text-shadow:0 6px 24px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.45);display:flex;gap:20px;overflow:hidden;padding:4px 10px}
.hl span{display:inline-block}
.hl span.em{color:#fff;background:#e3132b;padding:0 16px;border-radius:14px;text-shadow:none}
/* legenda palavra por palavra */
#cap{top:1030px;bottom:auto;height:auto;display:flex;justify-content:center;flex-wrap:wrap;padding:0 40px}
.cw{font:62px/1 IDB;color:#fff;letter-spacing:-.5px;margin:0 8px;display:inline-block;padding:9px 12px;border-radius:16px;
  text-shadow:0 0 2px #000,0 4px 0 rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.45)}
.cw.on{color:#0b0b0f;background:#fff;text-shadow:none}
.cw.hot{color:#fff;background:#e3132b;text-shadow:none}
/* cenas de corte */
.sc{background:radial-gradient(120% 90% at 50% 40%,#3a0a10 0%,#0b0b0f 70%)}
.sc .t{position:absolute;left:0;right:0;text-align:center;color:#fff}
#prod .name{top:300px;font:104px/0.95 IDB;letter-spacing:-2px}
#prod .sub{top:520px;font:44px/1 IS;color:#ff5a6b}
#prod img{position:absolute;left:50%;top:600px;height:640px;transform-origin:50% 100%;filter:drop-shadow(0 30px 40px rgba(227,19,43,.35))}
#black .k{top:330px;font:46px/1 IDX;color:#ff5a6b;letter-spacing:6px}
#black .n{top:400px;font:200px/0.9 IDB;letter-spacing:-5px}
#black .o{top:600px;font:128px/0.9 IDB;letter-spacing:-3px;color:#e3132b}
#black .r{top:800px;font:56px/1.15 IDX}
#black .r b{color:#ff5a6b;font-weight:normal}
#black .line{position:absolute;left:50%;top:760px;width:520px;height:6px;margin-left:-260px;background:#e3132b;border-radius:3px;transform-origin:50% 50%}
/* botão */
#cta{top:1140px;bottom:auto;height:auto;justify-content:center}
.ct{background:#e3132b;color:#fff;font:44px/1 IDB;padding:22px 38px;border-radius:999px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
/* cartão final */
#end{background:radial-gradient(120% 90% at 50% 35%,#3a0a10 0%,#0b0b0f 72%);flex-direction:column;align-items:center;justify-content:flex-start;padding-top:300px}
#end img{width:460px}
#end .k{font:50px/1 IDX;color:#ff5a6b;margin-top:60px;letter-spacing:6px}
#end .n{font:190px/0.9 IDB;color:#fff;margin-top:18px;letter-spacing:-5px}
#end .r{font:46px/1.35 IS;color:#fff;margin-top:34px;text-align:center}
#end .r b{color:#ff5a6b;font-weight:normal}
#end .p{margin-top:50px;background:#e3132b;color:#fff;font:56px/1 IDB;padding:26px 56px;border-radius:999px}
</style></head><body>
<div id="prod" class="L sc"><div class="t name" id="pn"></div><div class="t sub" id="ps"></div><img id="pi"></div>
<div id="black" class="L sc"><div class="t k">É A BLACK DA</div><div class="t n">BOTANIKA</div><div class="t o">SITE INTEIRO</div><div class="line" id="bl"></div><div class="t r">em condição especial<br><b>todos os suplementos</b></div></div>
<div id="hook" class="L"></div>
<div id="cap" class="L"></div>
<div id="cta" class="L"><div class="ct">Toque em Comprar agora <span id="arr" style="display:inline-block">↓</span></div></div>
<div id="end" class="L"><img src="logo-w.png"><div class="k">BLACK BOTANIKA</div><div class="n">O SITE<br>INTEIRO</div>
 <div class="r">no maior desconto<br><b>da história da Botanika</b></div>
 <div class="p">COMPRE AGORA</div></div>
<script>
function spring(t,w=14,z=0.55){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
function ease(t){t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,3);}
const $=id=>document.getElementById(id);
let C,chunks=[];
function setup(cfg){C=cfg;
 const h=$('hook');cfg.hook.lines.forEach(l=>{const d=document.createElement('div');d.className='hl';l.split(' ').forEach(w=>{const s=document.createElement('span');s.textContent=w;if(cfg.hook.em.includes(w))s.className='em';d.appendChild(s)});h.appendChild(d)});
 let cur=[];cfg.words.forEach(w=>{cur.push(w);const txt=cur.map(x=>x.w).join(' ');
  if(/[.,!?:]$/.test(w.w)||cur.length>=3||txt.length>=13){chunks.push(cur);cur=[]}});if(cur.length)chunks.push(cur);
 chunks.forEach((c,i)=>{c.a=c[0].t;c.b=i+1<chunks.length?Math.min(chunks[i+1][0].t,c[c.length-1].t+0.9):c[c.length-1].t+0.9;
  /* a legenda não atravessa o corte para o próximo trecho */
  const cut=(cfg.cuts||[]).find(x=>x>c.a+0.01);if(cut!==undefined)c.b=Math.min(c.b,cut);});}
function seek(t){
 let inScene=null;for(const s of C.scenes){if(t>=s.a&&t<s.b){inScene=s;break}}
 ['prod','black'].forEach(k=>$(k).style.display=(inScene&&inScene.kind==k)?'block':'none');
 if(inScene){const u=t-inScene.a,el=$(inScene.kind);
  el.style.clipPath=`inset(${(1-ease(u/0.18))*50}% 0 ${(1-ease(u/0.18))*50}% 0)`;
  if(inScene.kind=='prod'){$('pn').innerHTML=inScene.name;$('ps').textContent=inScene.sub;$('pi').src=inScene.img;
   const s=spring(u-0.05,11,0.5);$('pi').style.transform=`translateX(-50%) translateY(${(1-s)*700}px) rotate(${(1-s)*-14+Math.sin(u*2)*1.5}deg) scale(${1+u*0.03})`;
   $('pn').style.transform=`translateY(${(1-spring(u,14,0.6))*-80}px)`;$('pn').style.opacity=Math.min(1,u*6);$('ps').style.opacity=Math.min(1,Math.max(0,(u-0.2)*5));}
  if(inScene.kind=='black'){[...el.querySelectorAll('.t')].forEach((k,j)=>{const s=spring(u-0.07*j,14,0.55);k.style.transform=`translateY(${(1-s)*60}px) scale(${0.9+0.1*s})`;k.style.opacity=Math.min(1,s*1.8)});
   $('bl').style.transform=`scaleX(${ease((u-0.25)/0.35)})`;}
 }
 const H=C.hook,hk=$('hook');const hon=t>=H.a&&t<=H.b+0.2&&!inScene;hk.style.display=hon?'flex':'none';
 if(hon){let i=0;const o=t>H.b?ease((t-H.b)/0.2):0;hk.style.opacity=1-o;hk.querySelectorAll('span').forEach(sp=>{const s=spring(t-H.a-i*0.06,16,0.55);sp.style.transform=`translateY(${(1-s)*110}%)`;i++;});}
 const cap=$('cap');const ch=chunks.find(c=>t>=c.a&&t<c.b);
 if(ch&&!(t>=C.end)&&!inScene){cap.style.display='flex';cap.innerHTML='';const s0=spring(t-ch.a,18,0.6);
  ch.forEach(w=>{const sp=document.createElement('span');sp.className='cw';sp.textContent=w.w.replace(/[.,:]$/,'');
   const nx=ch[ch.indexOf(w)+1];if(t>=w.t&&(!nx||t<nx.t)){sp.classList.add(C.hot.some(h=>w.w.toLowerCase().startsWith(h))?'hot':'on');const ws=spring(t-w.t,20,0.5);sp.style.transform=`scale(${0.9+0.1*ws})`;}
   cap.appendChild(sp)});cap.style.transform=`translateY(${(1-s0)*30}px) scale(${0.92+0.08*s0})`;cap.style.opacity=Math.min(1,s0*2);}
 else cap.style.display='none';
 const K=C.cta,ct=$('cta');const con=t>=K.a&&t<K.b&&!inScene;ct.style.display=con?'flex':'none';
 if(con){const s=spring(t-K.a,14,0.45);const p=1+0.035*Math.sin((t-K.a)*2*Math.PI*1.4);ct.firstElementChild.style.transform=`scale(${(0.4+0.6*s)*p})`;
  $('arr').style.transform=`translateY(${Math.abs(Math.sin((t-K.a)*Math.PI*2.2))*-12}px)`;}
 const en=$('end');en.style.display=t>=C.end?'flex':'none';
 if(t>=C.end){const u=t-C.end;[...en.children].forEach((k,j)=>{const s=spring(u-0.05*j,14,0.6);k.style.transform=`translateY(${(1-s)*50}px)`;k.style.opacity=Math.min(1,s*1.6);});
  en.style.clipPath=`circle(${ease(u/0.35)*120}% at 50% 50%)`;}
}
</script></body></html>
