<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IS;src:url(InstrumentSans-SemiBold.woff2)}
@font-face{font-family:IDB;src:url(InterDisplay-Black.otf)}
@font-face{font-family:IDX;src:url(InterDisplay-ExtraBold.otf)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.abs{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
#hook{top:288px;gap:12px}
.hl{background:#fff;border-radius:24px;padding:16px 34px;display:flex;gap:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.w{font:64px/1.12 IDX;color:#0c298d;display:inline-block;letter-spacing:-.5px}
.w.em{color:#e2231a}
#tag{top:1168px}
.tg{background:#0c298d;color:#fff;font:44px/1 IDX;padding:18px 32px 18px 26px;border-radius:999px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.tg i{width:16px;height:16px;border-radius:50%;background:#c8f14b;display:block}
#offer{top:282px}
.of{width:880px;background:#0c298d;border-radius:40px;padding:26px 0 30px;display:flex;flex-direction:column;align-items:center;box-shadow:0 18px 40px rgba(0,0,0,.25);overflow:hidden;position:relative}
.of .k{font:36px/1 IDX;color:#c8f14b;letter-spacing:2px}
.of .big{font:124px/1 IDB;color:#fff;margin-top:14px;letter-spacing:-2px;display:flex;gap:22px}
.of .chips{display:flex;gap:14px;margin-top:20px}
.chip{background:rgba(255,255,255,.14);color:#fff;font:34px/1 IS;padding:14px 22px;border-radius:999px}
.chip b{color:#c8f14b;font-weight:normal}
#cta{top:1150px}
.ct{background:#e2231a;color:#fff;font:52px/1 IDB;padding:24px 40px;border-radius:999px;display:flex;align-items:center;gap:16px;box-shadow:0 12px 30px rgba(226,35,26,.35)}
#end{position:absolute;inset:0;background:#0c298d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:260px}
#end img{width:540px}
#end .k{font:54px/1 IDX;color:#c8f14b;margin-top:56px;letter-spacing:2px}
#end .n{font:210px/1 IDB;color:#fff;margin-top:20px;letter-spacing:-4px}
#end .o{font:124px/1 IDB;color:#fff;margin-top:-6px}
#end .r{font:40px/1.5 IS;color:#fff;margin-top:6px}
#end .r b{color:#c8f14b;font-weight:normal}
#end .p{margin-top:44px;background:#e2231a;color:#fff;font:58px/1 IDB;padding:26px 56px;border-radius:999px}
</style></head><body>
<div id="hook" class="abs"></div>
<div id="tag" class="abs"><div class="tg"><i></i><span id="tagt"></span></div></div>
<div id="offer" class="abs"><div class="of"><div class="k">ESQUENTA 11/11</div>
 <div class="big"><span>ATÉ</span><span id="pct">12%</span><span>OFF</span></div>
 <div class="chips"><div class="chip"><b>+</b> frete grátis</div><div class="chip"><b>+</b> cranberry de brinde</div></div></div></div>
<div id="cta" class="abs"><div class="ct">Toque em Comprar agora <span id="arr">↓</span></div></div>
<div id="end"><img src="logo-w.png"><div class="k">ESQUENTA 11/11</div><div class="n" id="en">ATÉ 12%</div><div class="o">OFF</div>
 <div class="r" style="margin-top:34px">8% em 1 un. · <b>10%</b> a partir de 3 · <b>12%</b> a partir de 5</div>
 <div class="r">Frete grátis acima de R$ 249</div><div class="r">Cranberry de brinde acima de R$ 400</div>
 <div class="p">SÓ ATÉ 10/11</div></div>
<script>
// pure function of time: every frame is computed from t only (no CSS transitions/timers)
function spring(t,w=14,z=0.55){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
function ease(t){t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,3);}
function vis(t,a,b){return t>=a-0.001&&t<=b+0.25;}
let C=null;
function setup(cfg){C=cfg;const h=document.getElementById('hook');h.innerHTML='';
 cfg.hook.lines.forEach(l=>{const d=document.createElement('div');d.className='hl';
  l.split(' ').forEach(w=>{const s=document.createElement('span');s.className='w'+(cfg.hook.em.includes(w)?' em':'');s.textContent=w;d.appendChild(s)});h.appendChild(d)});
 document.getElementById('tagt').textContent=cfg.tag.text;}
function out(t,b){return t>b?ease((t-b)/0.22):0}
function seek(t){
 const H=C.hook,hk=document.getElementById('hook');
 hk.style.display=vis(t,H.a,H.b)?'flex':'none';
 if(hk.style.display=='flex'){let i=0;const o=out(t,H.b);
  hk.querySelectorAll('.hl').forEach((ln,li)=>{const sl=spring(t-H.a-li*0.08,13,0.6);ln.style.transform=`scale(${0.85+0.15*sl})`;ln.style.opacity=Math.min(1,sl*1.4)*(1-o);
   ln.querySelectorAll('.w').forEach(w=>{const s=spring(t-H.a-0.06-i*0.07,16,0.6);w.style.transform=`translateY(${(1-s)*70}px)`;w.style.opacity=Math.min(1,s*1.5);i++;});});}
 const T=C.tag,tg=document.getElementById('tag');tg.style.display=vis(t,T.a,T.b)?'flex':'none';
 if(tg.style.display=='flex'){const s=spring(t-T.a,15,0.55),o=out(t,T.b);tg.style.transform=`translateX(${(1-s)*-500}px)`;tg.style.opacity=1-o;}
 const O=C.offer,of=document.getElementById('offer');of.style.display=vis(t,O.a,O.b)?'flex':'none';
 if(of.style.display=='flex'){const s=spring(t-O.a,12,0.5),o=out(t,O.b);of.style.transform=`scale(${0.55+0.45*s}) translateY(${o*-60}px)`;of.style.opacity=Math.min(1,s*2)*(1-o);
  const c=Math.min(1,Math.max(0,(t-O.a-0.25)/0.75));document.getElementById('pct').textContent=(c<0.34?8:c<0.67?10:12)+'%';
  of.querySelectorAll('.chip').forEach((ch,k)=>{const cs=spring(t-O.a-0.55-k*0.12,15,0.6);ch.style.transform=`translateY(${(1-cs)*40}px)`;ch.style.opacity=Math.min(1,cs*1.5);});}
 const K=C.cta,ct=document.getElementById('cta');ct.style.display=vis(t,K.a,K.b)?'flex':'none';
 if(ct.style.display=='flex'){const s=spring(t-K.a,14,0.45),o=out(t,K.b);const p=1+0.035*Math.sin((t-K.a)*2*Math.PI*1.4)*Math.min(1,(t-K.a)/0.6);
  ct.firstElementChild.style.transform=`scale(${(0.4+0.6*s)*p})`;ct.style.opacity=Math.min(1,s*2)*(1-o);
  document.getElementById('arr').style.transform=`translateY(${Math.abs(Math.sin((t-K.a)*Math.PI*2.2))*-12}px)`;document.getElementById('arr').style.display='inline-block';}
 const E=C.end,en=document.getElementById('end');en.style.display=t>=E?'flex':'none';
 if(t>=E){const u=t-E;const kids=[...en.children];kids.forEach((k,j)=>{const s=spring(u-0.05*j,14,0.6);k.style.transform=`translateY(${(1-s)*50}px)`;k.style.opacity=Math.min(1,s*1.6);});
  en.style.clipPath=`circle(${ease(u/0.35)*120}% at 50% 60%)`;
  {const e=ease((u-0.2)/0.6);document.getElementById('en').textContent='ATÉ '+(e<0.34?8:e<0.67?10:12)+'%';}}
}
</script></body></html>
